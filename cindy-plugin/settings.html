<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>

  <div style="margin-top:10px"><button id="save">保存</button> <span id="msg" style="margin-left:8px"></span></div>
  <script src="/settings.js"></script>
