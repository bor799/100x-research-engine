<style>:root{--paper:#f3efe5;--card:#fbfaf6;--ink:#171612;--muted:#6c675e;--rule:#24221d;--line:#d8d1c2;--red:#a63228}

ul.issues a{text-decoration:none}
ul.issues a:hover{color:var(--red)}
ul.issues .n{color:var(--muted);font-family:"PingFang SC",sans-serif;font-size:12px;margin-right:8px}
.more{display:inline-block;font-family:"PingFang SC",sans-serif;font-size:13px;letter-spacing:.1em;color:var(--red);text-decoration:none;border-bottom:2px solid var(--red);padding-bottom:3px;margin-top:14px}
.foot{margin-top:36px;font-family:"PingFang SC",sans-serif;font-size:12px;color:var(--muted);letter-spacing:.08em}
